version: '3.11'

services:
  # ==================== API 后端服务 ====================
  api:
    build: .
    container_name: app-api
    restart: unless-stopped
    command: fastapi run main.py --host 0.0.0.0 --port 8111
    ports:
      - "8111:8111"
    env_file:
      - .env
    environment:
      PROJECT_NAME: "MY FIRST FULL STACK TEMPLATE"
      DATABASE_URL: sqlite+aiosqlite:///./data.db
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: admin123
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8111/docs')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==================== 前端 Web 服务 ====================
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://82.157.96.215:8111
    container_name: app-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  uploads_data: