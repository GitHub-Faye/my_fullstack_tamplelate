version: '3.11'

services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    command: redis-server --requirepass redis123 --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ==================== API 后端服务 ====================
  api:
    build: .
    container_name: app-api
    restart: unless-stopped
    command: fastapi run main.py --host 0.0.0.0 --port 8111
    ports:
      - "8111:8111"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:redis123@redis:6379/0
      CELERY_BROKER_URL: amqp://celery_user:celery123@rabbitmq:5672/celery_vhost
      CELERY_RESULT_BACKEND: redis://:redis123@redis:6379/1
      ENVIRONMENT: production
      FIRST_SUPERUSER_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8111/docs')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==================== RabbitMQ（作为 Celery Broker） ====================
  rabbitmq:
    image: rabbitmq:4-management   # 带 Web 管理界面（推荐）
    container_name: app-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP 端口（Celery 连接用）
      - "15672:15672"  # 管理界面端口（浏览器访问）
    environment:
      RABBITMQ_DEFAULT_USER: celery_user      # 自定义用户（不要用 guest 生产）
      RABBITMQ_DEFAULT_PASS: celery123        # 生产请改成强密码
      RABBITMQ_DEFAULT_VHOST: celery_vhost    # 独立虚拟主机（推荐）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ==================== Celery Worker ====================
  celery-worker:
    build: .
    container_name: app-celery-worker
    restart: unless-stopped
    command: /app/.venv/bin/celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 --pool=prefork
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:redis123@redis:6379/0
      CELERY_BROKER_URL: amqp://celery_user:celery123@rabbitmq:5672/celery_vhost
      CELERY_RESULT_BACKEND: redis://:redis123@redis:6379/1
      ENVIRONMENT: production

  # ==================== Flower（Celery 监控） ====================
  # flower:
  #   build: .
  #   container_name: app-flower
  #   restart: unless-stopped
  #   command: celery -A app.tasks.celery_app flower --port=5555 --broker=amqp://celery_user:celery123@rabbitmq:5672/celery_vhost
  #   ports:
  #     - "5555:5555"
  #   env_file:
  #     - .env
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     celery-worker:
  #       condition: service_started
  #   environment:
  #     REDIS_URL: redis://:redis123@redis:6379/0
  #     CELERY_BROKER_URL: amqp://celery_user:celery123@rabbitmq:5672/celery_vhost
  #     CELERY_RESULT_BACKEND: redis://:redis123@redis:6379/1
  #     ENVIRONMENT: production

  # ==================== Adminer（数据库可视化） ====================
  # adminer:
