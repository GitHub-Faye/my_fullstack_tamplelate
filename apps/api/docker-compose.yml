  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     ADMINER_DEFAULT_SERVER: postgres
  #     ADMINER_DEFAULT_DB: appdb

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  uploads_data: