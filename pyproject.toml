[project]
name = "my-fullstack-tamplelate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === Web Framework & Server ===
    "fastapi[standard]>=0.139.0",
    "uvicorn>=0.51.0",
    "gunicorn>=25.0.0",
    # === Database & ORM ===
    "sqlmodel>=0.0.39",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.0",
    # === Auth & Security ===
    "pyjwt>=2.12.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    # === Logging ===
    "structlog>=25.0.0",
    # === Validation & Config ===
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
]

environment = ".venv"

[dependency-groups]
dev = [
    # === Testing ===
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.0",
    "coverage>=7.13.0",

    # === Code Quality ===
    "ruff>=0.15.0",
    "pyright>=1.1.409",

    # === Utility ===
    "requests>=2.33.0",
    "python-dateutil>=2.9.0",
    "pytz>=2026.1",
    "pyyaml>=6.0.0",
    "cryptography>=46.0.0",
]
